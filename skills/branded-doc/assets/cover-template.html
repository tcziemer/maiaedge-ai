<!--
  COVER PAGE TEMPLATE — MaiaEdge branded-doc skill
  Drop the body into a full HTML page that links brand.css.
  Replace the {{tokens}} with the doc-specific values.

  Required tokens:
    {{segment_tag}}    e.g. "Partner Cheat Sheet" or "Partner Edition"
    {{icon_path}}      e.g. "assets/icons/DC Cabinet.svg"
    {{segment_sub}}    e.g. "MaiaEdge for Colocation Operators"
    {{title}}          e.g. "Colocation"
    {{title_accent}}   e.g. "Cheat Sheet."
    {{subtitle}}       1-2 sentence description of when to use this doc
-->
<section class="cover">
  <div class="cover-eyebrow">{{segment_tag}}</div>
  <div class="cover-meta">Confidential<br/>For Partner Use</div>
  <img src="assets/logos/logo-white.svg" alt="MaiaEdge" class="cover-logo"/>
  <div class="cover-icon-block">
    <div class="cover-icon"><img src="{{icon_path}}" alt=""/></div>
    <div>
      <div class="cover-segment-tag">{{segment_tag}}</div>
      <div class="cover-segment-sub">{{segment_sub}}</div>
    </div>
  </div>
  <h1 class="cover-title">{{title}}<br/><span class="accent">{{title_accent}}</span></h1>
  <p class="cover-sub">{{subtitle}}</p>
  <div class="cover-tagline-block">
    <p class="cover-tagline">Private paths. Any network. Instantly.</p>
    <p class="cover-tagline-sub">Carrier infrastructure for federated private networking</p>
  </div>
</section>
