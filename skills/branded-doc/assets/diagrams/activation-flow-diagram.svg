<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1200" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="40" y="40" width="1520" height="74" fill="#1A1A1A"/>
  <rect x="40" y="40" width="8" height="74" fill="#FFC200"/>
  <text x="76" y="78" font-size="14" letter-spacing="3" font-weight="700" fill="#FFC200">8 STEPS · INITIAL DEPLOY → LIVE PATH</text>
  <text x="76" y="100" font-size="11" letter-spacing="2" fill="#D4D0C9">Step 1 is the ONLY physical action. Steps 2-8 happen remotely through the PCE.</text>
  <text x="1520" y="86" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="end">Activation Flow</text>

  <!-- 8 steps as vertical timeline. Y starts at 160, each step is 130 tall -->
  <!-- vertical guide line -->
  <line x1="120" y1="200" x2="120" y2="1140" stroke="#E5E1DA" stroke-width="3"/>

  <!-- Step template macro inline -->
  <!-- STEP 1 -->
  <g transform="translate(0, 160)">
    <circle cx="120" cy="50" r="36" fill="#FFC200" stroke="#1A1A1A" stroke-width="3"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">01</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">PHYSICAL DEPLOY · ONE-TIME</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">Deploy PBC at network boundary</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">1RU rack install. Plug in. Power up. The only on-site step.</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(0, 280)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">02</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">REGISTRATION</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">PBC phones home; operator claims it</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">PBC connects out to the PCE. Operator sees it appear in the dashboard, confirms.</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(0, 400)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">03</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">DISCOVERY</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">PCE discovers available paths &amp; transport</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Fiber, lit waves, DIA, partner networks - auto-detected and inventoried.</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(0, 520)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">04</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">REQUEST</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">Customer requests a path between endpoints</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Self-service through the white-label portal, or programmatically via API.</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(0, 640)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">05</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">COMPUTE</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">PCE computes the optimal path</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Latency · utilization · policy · bandwidth · SRLG diversity. All considered.</text>
  </g>

  <!-- STEP 6 -->
  <g transform="translate(0, 760)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">06</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">PROGRAM</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">PCE programs the PBCs</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Instructions only - no local config, no routing protocols, no truck rolls.</text>
  </g>

  <!-- STEP 7 — gold-filled circle, this is when traffic flows -->
  <g transform="translate(0, 880)">
    <circle cx="120" cy="50" r="36" fill="#FFC200" stroke="#1A1A1A" stroke-width="3"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">07</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">PATH IS LIVE</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">Traffic flows. Encrypted end-to-end.</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Line-rate AES-256-GCM IPsec. Sub-2 µs latency overhead. Deterministic forwarding.</text>
  </g>

  <!-- STEP 8 -->
  <g transform="translate(0, 1000)">
    <circle cx="120" cy="50" r="36" fill="#FFFFFF" stroke="#FFC200" stroke-width="4"/>
    <text x="120" y="62" font-size="26" font-weight="800" fill="#1A1A1A" text-anchor="middle">08</text>
    <text x="190" y="42" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">CONTINUOUS</text>
    <text x="190" y="72" font-size="22" font-weight="700" fill="#1A1A1A">PCE collects telemetry &amp; auto-reroutes</text>
    <text x="190" y="98" font-size="14" fill="#4A4A4A">Hop-by-hop visibility. SLA-aware. Hitless reroute if a path degrades.</text>
  </g>

  <!-- Right side callout box: Critical -->
  <g transform="translate(1080, 320)">
    <rect x="0" y="0" width="460" height="180" fill="#1A1A1A"/>
    <rect x="0" y="0" width="6" height="180" fill="#FFC200"/>
    <text x="30" y="38" font-size="13" letter-spacing="3" font-weight="700" fill="#FFC200">CRITICAL</text>
    <text x="30" y="80" font-size="22" font-weight="800" fill="#FFFFFF">Minutes, not months.</text>
    <text x="30" y="115" font-size="14" fill="#D4D0C9">After step 1, every other step happens</text>
    <text x="30" y="135" font-size="14" fill="#D4D0C9">remotely through the PCE.</text>
    <text x="30" y="160" font-size="14" fill="#D4D0C9" font-weight="700">No truck rolls. No on-site config.</text>
  </g>

  <!-- Right side: from 60-90 days → minutes -->
  <g transform="translate(1080, 540)">
    <rect x="0" y="0" width="460" height="170" fill="#F4F2EE" stroke="#E5E1DA" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="170" fill="#FF9400"/>
    <text x="30" y="38" font-size="13" letter-spacing="3" font-weight="700" fill="#FF9400">BEFORE  /  AFTER</text>
    <g transform="translate(30, 60)">
      <text x="0" y="20" font-size="48" font-weight="800" fill="#4A4A4A" text-decoration="line-through">60–90</text>
      <text x="180" y="20" font-size="14" fill="#4A4A4A">days to provision</text>
      <text x="180" y="38" font-size="14" fill="#4A4A4A">a cross-carrier path</text>
    </g>
    <line x1="30" y1="115" x2="430" y2="115" stroke="#E5E1DA" stroke-width="1"/>
    <g transform="translate(30, 130)">
      <text x="0" y="20" font-size="48" font-weight="800" fill="#FF9400">MIN.</text>
      <text x="180" y="20" font-size="14" fill="#1A1A1A" font-weight="700">with MaiaEdge</text>
    </g>
  </g>

  <!-- Bottom rule -->
  <line x1="40" y1="1170" x2="1560" y2="1170" stroke="#FFC200" stroke-width="2"/>
  <text x="40" y="1192" font-size="11" letter-spacing="3" font-weight="700" fill="#4A4A4A">MAIAEDGE  ·  ACTIVATION FLOW  ·  PATH BORDER CONTROLLER + PATH COMPUTATION ENGINE</text>
</svg>
