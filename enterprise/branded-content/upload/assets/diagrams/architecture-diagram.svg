<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- gold gradient for arrow heads -->
    <marker id="arrowGold" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#FFC200"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="1100" fill="#FFFFFF"/>

  <!-- ============================================== -->
  <!-- LAYER LABEL — left side -->
  <!-- ============================================== -->
  <g font-size="14" letter-spacing="3" font-weight="700" fill="#FF9400">
    <text x="40" y="120" text-anchor="start">CUSTOMER LAYER</text>
    <text x="40" y="430" text-anchor="start">CONTROL PLANE</text>
    <text x="40" y="800" text-anchor="start">DATA PLANE</text>
  </g>

  <!-- ============================================== -->
  <!-- 1. CUSTOMER PORTAL (top) -->
  <!-- ============================================== -->
  <g transform="translate(440, 80)">
    <!-- box -->
    <rect x="0" y="0" width="720" height="140" fill="#F4F2EE" stroke="#E5E1DA" stroke-width="2"/>
    <!-- gold top border -->
    <rect x="0" y="0" width="720" height="6" fill="#FFC200"/>
    <!-- icon: simple computer/portal -->
    <g transform="translate(40, 35)" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <rect x="0" y="0" width="60" height="42" rx="3"/>
      <line x1="0" y1="9" x2="60" y2="9"/>
      <circle cx="6" cy="4.5" r="1.5" fill="#1A1A1A"/>
      <circle cx="12" cy="4.5" r="1.5" fill="#1A1A1A"/>
      <circle cx="18" cy="4.5" r="1.5" fill="#1A1A1A"/>
      <line x1="20" y1="55" x2="40" y2="55"/>
      <line x1="30" y1="48" x2="30" y2="55"/>
    </g>
    <!-- text -->
    <text x="130" y="55" font-size="22" font-weight="700" fill="#1A1A1A">Customer Portal</text>
    <text x="130" y="80" font-size="14" letter-spacing="2" fill="#FF9400" font-weight="700">WHITE-LABEL · OPERATOR'S BRAND</text>
    <text x="130" y="105" font-size="14" fill="#4A4A4A">Self-service. Tenants see only their own paths and metrics.</text>
  </g>

  <!-- arrow from Portal to PCE -->
  <line x1="800" y1="220" x2="800" y2="290" stroke="#1A1A1A" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <rect x="780" y="240" width="100" height="18" fill="#FFFFFF"/>
  <text x="830" y="253" font-size="12" letter-spacing="2" font-weight="700" fill="#4A4A4A" text-anchor="middle">HTTPS / API</text>

  <!-- ============================================== -->
  <!-- 2. PCE (center, hero) -->
  <!-- ============================================== -->
  <g transform="translate(280, 300)">
    <!-- box: black with gold accents -->
    <rect x="0" y="0" width="1040" height="240" fill="#1A1A1A"/>
    <!-- gold left bar -->
    <rect x="0" y="0" width="8" height="240" fill="#FFC200"/>
    <!-- cloud icon -->
    <g transform="translate(50, 70)" fill="none" stroke="#FFC200" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 80 C 8 80, 0 70, 0 56 C 0 42, 12 34, 24 34 C 28 18, 44 8, 60 8 C 76 8, 90 18, 94 34 C 110 34, 122 46, 122 60 C 122 74, 110 84, 94 84 L 22 80 Z"/>
      <text x="40" y="65" font-size="20" font-weight="700" fill="#FFC200" stroke="none">PCE</text>
    </g>

    <!-- title -->
    <text x="220" y="65" font-size="14" letter-spacing="3" font-weight="700" fill="#FFC200">CLOUD-NATIVE NNI ENGINE</text>
    <text x="220" y="105" font-size="32" font-weight="800" fill="#FFFFFF">Path Computation Engine</text>

    <!-- bullet list of capabilities (2 columns) -->
    <g font-size="15" fill="#D4D0C9">
      <g transform="translate(220, 140)">
        <text x="0" y="0"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Real-time deterministic path computation</text>
        <text x="0" y="24"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Hop-by-hop telemetry &amp; policy enforcement</text>
        <text x="0" y="48"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Multi-tenant isolation</text>
      </g>
      <g transform="translate(640, 140)">
        <text x="0" y="0"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Equinix Fabric · Megaport · AWS · Azure · GCP</text>
        <text x="0" y="24"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Mplify LSO Sonata + TM Forum ODA conformant</text>
        <text x="0" y="48"><tspan fill="#FFC200" font-weight="700">▸</tspan>  Auto-failover with hitless reroute</text>
      </g>
    </g>
  </g>

  <!-- arrows from PCE to PBCs -->
  <g stroke="#1A1A1A" stroke-width="2.5" fill="none">
    <line x1="500" y1="540" x2="500" y2="640" marker-end="url(#arrowDark)"/>
    <line x1="1100" y1="540" x2="1100" y2="640" marker-end="url(#arrowDark)"/>
  </g>
  <rect x="640" y="565" width="320" height="22" fill="#FFFFFF"/>
  <text x="800" y="580" font-size="13" letter-spacing="2" font-weight="700" fill="#4A4A4A" text-anchor="middle">PROGRAMS PBCs VIA SECURE CHANNEL</text>

  <!-- ============================================== -->
  <!-- 3. TWO PBCs (bottom, side by side) -->
  <!-- ============================================== -->
  <g transform="translate(280, 650)">
    <!-- LEFT PBC -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="440" height="200" fill="#F4F2EE" stroke="#E5E1DA" stroke-width="2"/>
      <rect x="0" y="0" width="6" height="200" fill="#FFC200"/>
      <!-- PBC icon (1RU rack appliance) -->
      <g transform="translate(30, 30)" stroke="#1A1A1A" stroke-width="2.5" fill="none">
        <rect x="0" y="20" width="80" height="32" rx="2" fill="#FFC200" stroke="#1A1A1A"/>
        <rect x="8" y="32" width="6" height="6" fill="#1A1A1A"/>
        <rect x="20" y="32" width="6" height="6" fill="#1A1A1A"/>
        <rect x="32" y="32" width="6" height="6" fill="#1A1A1A"/>
        <circle cx="68" cy="36" r="3" fill="#FFFFFF" stroke="#1A1A1A"/>
      </g>
      <!-- label -->
      <text x="135" y="42" font-size="13" letter-spacing="2" font-weight="700" fill="#FF9400">EDGE HARDWARE</text>
      <text x="135" y="68" font-size="22" font-weight="800" fill="#1A1A1A">Path Border Controller</text>
      <!-- specs -->
      <g font-size="13" fill="#4A4A4A">
        <text x="20" y="115">▪ 1RU appliance · stateless forwarder</text>
        <text x="20" y="138">▪ Dual 100G · line-rate AES-256-GCM IPsec</text>
        <text x="20" y="161">▪ &lt; 2 µs latency · no BGP / OSPF / MPLS</text>
        <text x="20" y="184">▪ Optional 48-port Port Extender for fan-out</text>
      </g>
    </g>

    <!-- horizontal connection between the two PBCs -->
    <g transform="translate(440, 100)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="#FFC200" stroke-width="3" stroke-dasharray="6,5"/>
      <rect x="40" y="-14" width="100" height="20" fill="#FFFFFF"/>
      <text x="90" y="0" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">PRIVATE PATH</text>
      <text x="90" y="18" font-size="11" fill="#4A4A4A" text-anchor="middle">encrypted end-to-end</text>
    </g>

    <!-- RIGHT PBC -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="440" height="200" fill="#F4F2EE" stroke="#E5E1DA" stroke-width="2"/>
      <rect x="0" y="0" width="6" height="200" fill="#FFC200"/>
      <g transform="translate(30, 30)" stroke="#1A1A1A" stroke-width="2.5" fill="none">
        <rect x="0" y="20" width="80" height="32" rx="2" fill="#FFC200" stroke="#1A1A1A"/>
        <rect x="8" y="32" width="6" height="6" fill="#1A1A1A"/>
        <rect x="20" y="32" width="6" height="6" fill="#1A1A1A"/>
        <rect x="32" y="32" width="6" height="6" fill="#1A1A1A"/>
        <circle cx="68" cy="36" r="3" fill="#FFFFFF" stroke="#1A1A1A"/>
      </g>
      <text x="135" y="42" font-size="13" letter-spacing="2" font-weight="700" fill="#FF9400">EDGE HARDWARE</text>
      <text x="135" y="68" font-size="22" font-weight="800" fill="#1A1A1A">Path Border Controller</text>
      <g font-size="13" fill="#4A4A4A">
        <text x="20" y="115">▪ Forwards deterministically per PCE rules</text>
        <text x="20" y="138">▪ Independent of cloud control plane</text>
        <text x="20" y="161">▪ Carries telemetry + policy at line rate</text>
        <text x="20" y="184">▪ Sits at carrier or partner boundary</text>
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 4. SIDE-LABELS — customer / network sides -->
  <!-- ============================================== -->
  <g transform="translate(280, 880)">
    <!-- left PBC sides -->
    <g transform="translate(0, 0)">
      <line x1="60" y1="0" x2="60" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <line x1="200" y1="0" x2="200" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <line x1="340" y1="0" x2="340" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <text x="60" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">CUSTOMER SIDE</text>
      <text x="60" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">tenant /</text>
      <text x="60" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">demarcation</text>
      <text x="200" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">NETWORK</text>
      <text x="200" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">operator</text>
      <text x="200" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">backbone</text>
      <text x="340" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">PARTNER</text>
      <text x="340" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">cross-carrier</text>
      <text x="340" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">handoff</text>
    </g>
    <!-- right PBC sides -->
    <g transform="translate(620, 0)">
      <line x1="60" y1="0" x2="60" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <line x1="200" y1="0" x2="200" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <line x1="340" y1="0" x2="340" y2="40" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowDark)"/>
      <text x="60" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">CUSTOMER SIDE</text>
      <text x="60" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">tenant /</text>
      <text x="60" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">demarcation</text>
      <text x="200" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">DIA / FIBER</text>
      <text x="200" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">any</text>
      <text x="200" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">underlay</text>
      <text x="340" y="78" font-size="12" letter-spacing="2" font-weight="700" fill="#FF9400" text-anchor="middle">CLOUD</text>
      <text x="340" y="98" font-size="12" fill="#4A4A4A" text-anchor="middle">AWS DX · Azure ER</text>
      <text x="340" y="113" font-size="12" fill="#4A4A4A" text-anchor="middle">via Megaport / Equinix</text>
    </g>
  </g>

  <!-- bottom rule -->
  <line x1="40" y1="1060" x2="1560" y2="1060" stroke="#FFC200" stroke-width="2"/>
  <text x="40" y="1085" font-size="11" letter-spacing="3" font-weight="700" fill="#4A4A4A">MAIAEDGE  ·  PBC AT THE EDGE  ·  PCE IN THE CLOUD  ·  PORTAL UNDER OPERATOR'S BRAND</text>
</svg>
