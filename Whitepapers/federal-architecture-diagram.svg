<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Tomorrow, -apple-system, Segoe UI, sans-serif">
  <!-- ==============================================================
       Federal Reference Architecture diagram
       MaiaEdge brand: Gold #FFC200, Orange #FF9400, Black #000000,
       Heather Tint #F4F2EE, Ink #1A1A1A, Rule #E5E1DA
       ============================================================== -->
  <defs>
    <!-- arrow marker -->
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="ahg" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#FFC200"/>
    </marker>
    <marker id="ahw" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- ============== PCE control plane (top) ============== -->
  <g>
    <rect x="380" y="40" width="840" height="120" rx="6" fill="#000000"/>
    <rect x="380" y="40" width="6" height="120" fill="#FFC200"/>
    <text x="410" y="76" font-size="18" font-weight="700" fill="#FFC200" letter-spacing="3">CONTROL PLANE</text>
    <text x="410" y="112" font-size="34" font-weight="800" fill="#FFFFFF">Path Computation Engine</text>
    <text x="410" y="140" font-size="18" fill="#D4D0C9">Cloud-managed · Customer-controlled · Programs path policy and selects underlay</text>
  </g>

  <!-- arrows from PCE down to each endpoint's outer transport -->
  <g stroke="#FFC200" stroke-width="2.5" stroke-dasharray="6,5" fill="none">
    <line x1="500" y1="160" x2="290" y2="610" marker-end="url(#ahg)"/>
    <line x1="1100" y1="160" x2="1310" y2="610" marker-end="url(#ahg)"/>
  </g>
  <text x="350" y="380" font-size="13" font-weight="600" fill="#FF9400" letter-spacing="2.5">PROGRAMS PBCS</text>
  <text x="1180" y="380" font-size="13" font-weight="600" fill="#FF9400" letter-spacing="2.5">PROGRAMS PBCS</text>

  <!-- ============== Site labels ============== -->
  <text x="200" y="225" font-size="14" font-weight="700" fill="#FF9400" letter-spacing="3">SITE A</text>
  <text x="1380" y="225" font-size="14" font-weight="700" fill="#FF9400" letter-spacing="3" text-anchor="end">SITE B</text>

  <!-- ============== Layer 1: Mission Applications ============== -->
  <g>
    <rect x="120" y="240" width="340" height="80" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="290" y="278" font-size="13" font-weight="700" fill="#FF9400" letter-spacing="2.5" text-anchor="middle">MISSION APPLICATIONS</text>
    <text x="290" y="305" font-size="16" fill="#1A1A1A" text-anchor="middle">Workloads, sensors, command systems</text>
  </g>
  <g>
    <rect x="1140" y="240" width="340" height="80" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="1310" y="278" font-size="13" font-weight="700" fill="#FF9400" letter-spacing="2.5" text-anchor="middle">MISSION APPLICATIONS</text>
    <text x="1310" y="305" font-size="16" fill="#1A1A1A" text-anchor="middle">Workloads, sensors, command systems</text>
  </g>
  <!-- Layer 1 horizontal connection -->
  <g>
    <line x1="460" y1="280" x2="1140" y2="280" stroke="#1A1A1A" stroke-width="1.6"
          marker-start="url(#ah)" marker-end="url(#ah)"/>
    <rect x="700" y="262" width="200" height="36" rx="18" fill="#FFFFFF" stroke="#E5E1DA"/>
    <text x="800" y="286" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">IPsec / BGP routed</text>
  </g>

  <!-- vertical connectors between L1 and L2 -->
  <line x1="290" y1="320" x2="290" y2="365" stroke="#1A1A1A" stroke-width="1.6"/>
  <line x1="1310" y1="320" x2="1310" y2="365" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- ============== Layer 2: Inline Type-1 Encryption ============== -->
  <g>
    <rect x="120" y="365" width="340" height="115" rx="4" fill="#000000"/>
    <rect x="120" y="365" width="6" height="115" fill="#FFC200"/>
    <text x="290" y="397" font-size="13" font-weight="700" fill="#FFC200" letter-spacing="2.5" text-anchor="middle">INLINE TYPE-1 ENCRYPTOR</text>
    <text x="290" y="425" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">HAIPE inline (program-fielded)</text>
    <text x="290" y="455" font-size="14" fill="#D4D0C9" text-anchor="middle">e.g. GDMS TACLANE, Viasat L2,</text>
    <text x="290" y="473" font-size="14" fill="#D4D0C9" text-anchor="middle">or other certified equivalents</text>
  </g>
  <g>
    <rect x="1140" y="365" width="340" height="115" rx="4" fill="#000000"/>
    <rect x="1140" y="365" width="6" height="115" fill="#FFC200"/>
    <text x="1310" y="397" font-size="13" font-weight="700" fill="#FFC200" letter-spacing="2.5" text-anchor="middle">INLINE TYPE-1 ENCRYPTOR</text>
    <text x="1310" y="425" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">HAIPE inline (program-fielded)</text>
    <text x="1310" y="455" font-size="14" fill="#D4D0C9" text-anchor="middle">e.g. GDMS TACLANE, Viasat L2,</text>
    <text x="1310" y="473" font-size="14" fill="#D4D0C9" text-anchor="middle">or other certified equivalents</text>
  </g>
  <!-- Layer 2 horizontal connection (Type-1 inner encryption end-to-end) -->
  <g>
    <line x1="460" y1="422" x2="1140" y2="422" stroke="#FFC200" stroke-width="3"
          marker-start="url(#ahg)" marker-end="url(#ahg)"/>
    <rect x="660" y="402" width="280" height="40" rx="20" fill="#000000" stroke="#FFC200" stroke-width="1.5"/>
    <text x="800" y="427" font-size="14" font-weight="700" fill="#FFC200" text-anchor="middle">Type-1 inner encryption (end-to-end)</text>
  </g>

  <!-- vertical connector with the "Layer 2 transparent" callout -->
  <g>
    <line x1="290" y1="480" x2="290" y2="555" stroke="#1A1A1A" stroke-width="1.6" stroke-dasharray="3,3"/>
    <line x1="1310" y1="480" x2="1310" y2="555" stroke="#1A1A1A" stroke-width="1.6" stroke-dasharray="3,3"/>
  </g>
  <g>
    <rect x="600" y="495" width="400" height="46" rx="6" fill="#F4F2EE" stroke="#FF9400" stroke-width="1.5"/>
    <rect x="600" y="495" width="5" height="46" fill="#FF9400"/>
    <text x="800" y="525" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle">Layer 2 frames · transparent to inner encryption above</text>
  </g>

  <!-- ============== Layer 3: MaiaEdge Outer Transport ============== -->
  <g>
    <rect x="120" y="555" width="340" height="115" rx="4" fill="#FFC200"/>
    <rect x="120" y="555" width="6" height="115" fill="#000000"/>
    <text x="290" y="587" font-size="13" font-weight="700" fill="#000000" letter-spacing="2.5" text-anchor="middle">OUTER TRANSPORT</text>
    <text x="290" y="617" font-size="22" font-weight="800" fill="#000000" text-anchor="middle">MaiaEdge PBC</text>
    <text x="290" y="643" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">on Intel IPU silicon</text>
    <text x="290" y="662" font-size="13" fill="#1A1A1A" text-anchor="middle">AES-256-GCM line-rate · CNSA 2.0 ready</text>
  </g>
  <g>
    <rect x="1140" y="555" width="340" height="115" rx="4" fill="#FFC200"/>
    <rect x="1140" y="555" width="6" height="115" fill="#000000"/>
    <text x="1310" y="587" font-size="13" font-weight="700" fill="#000000" letter-spacing="2.5" text-anchor="middle">OUTER TRANSPORT</text>
    <text x="1310" y="617" font-size="22" font-weight="800" fill="#000000" text-anchor="middle">MaiaEdge PBC</text>
    <text x="1310" y="643" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">on Intel IPU silicon</text>
    <text x="1310" y="662" font-size="13" fill="#1A1A1A" text-anchor="middle">AES-256-GCM line-rate · CNSA 2.0 ready</text>
  </g>
  <!-- Layer 3 horizontal: outer transport blends underlay -->
  <g>
    <line x1="460" y1="612" x2="1140" y2="612" stroke="#000000" stroke-width="3"
          marker-start="url(#ah)" marker-end="url(#ah)"/>
    <rect x="660" y="592" width="280" height="40" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="800" y="617" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">Outer transport · blended underlay</text>
  </g>

  <!-- ============== Layer 4: Diverse Underlay ============== -->
  <!-- Site A fan -->
  <g stroke="#1A1A1A" stroke-width="1.6" fill="none">
    <line x1="220" y1="670" x2="180" y2="745"/>
    <line x1="290" y1="670" x2="290" y2="745"/>
    <line x1="360" y1="670" x2="400" y2="745"/>
  </g>
  <!-- Site A underlay tags -->
  <g>
    <rect x="120" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="180" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">FIBER</text>
    <text x="180" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">primary capacity</text>
  </g>
  <g>
    <rect x="240" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="300" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">LEO SATCOM</text>
    <text x="300" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">diverse alternate</text>
  </g>
  <g>
    <rect x="360" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="420" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">DIA / INTERNET</text>
    <text x="420" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">tertiary path</text>
  </g>
  <!-- Site B fan -->
  <g stroke="#1A1A1A" stroke-width="1.6" fill="none">
    <line x1="1240" y1="670" x2="1200" y2="745"/>
    <line x1="1310" y1="670" x2="1310" y2="745"/>
    <line x1="1380" y1="670" x2="1420" y2="745"/>
  </g>
  <g>
    <rect x="1140" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="1200" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">FIBER</text>
    <text x="1200" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">primary capacity</text>
  </g>
  <g>
    <rect x="1260" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="1320" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">LEO SATCOM</text>
    <text x="1320" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">diverse alternate</text>
  </g>
  <g>
    <rect x="1380" y="745" width="120" height="50" rx="4" fill="#F4F2EE" stroke="#E5E1DA"/>
    <text x="1440" y="770" font-size="12" font-weight="700" fill="#FF9400" letter-spacing="2" text-anchor="middle">DIA / INTERNET</text>
    <text x="1440" y="787" font-size="11" fill="#1A1A1A" text-anchor="middle">tertiary path</text>
  </g>

  <!-- Underlay band: connecting all 6 underlay tags through a single blended underlay -->
  <g>
    <rect x="80" y="830" width="1440" height="84" rx="4" fill="#000000"/>
    <rect x="80" y="830" width="6" height="84" fill="#FFC200"/>
    <text x="800" y="862" font-size="13" font-weight="700" fill="#FFC200" letter-spacing="3" text-anchor="middle">DIVERSE UNDERLAY</text>
    <text x="800" y="894" font-size="16" fill="#FFFFFF" text-anchor="middle">Blended by the control plane against policy, latency, jitter, SRLG diversity</text>
  </g>
  <!-- vertical connectors from underlay tags to band -->
  <g stroke="#000000" stroke-width="1.6" fill="none">
    <line x1="180" y1="795" x2="180" y2="830"/>
    <line x1="300" y1="795" x2="300" y2="830"/>
    <line x1="420" y1="795" x2="420" y2="830"/>
    <line x1="1200" y1="795" x2="1200" y2="830"/>
    <line x1="1320" y1="795" x2="1320" y2="830"/>
    <line x1="1440" y1="795" x2="1440" y2="830"/>
  </g>

  <!-- ============== Footer caption ============== -->
  <g>
    <text x="800" y="980" font-size="14" font-weight="600" fill="#FF9400" letter-spacing="2.5" text-anchor="middle">REFERENCE ARCHITECTURE</text>
    <text x="800" y="1010" font-size="18" fill="#1A1A1A" text-anchor="middle">Inner encryption stays in its certified position. Outer transport carries it across</text>
    <text x="800" y="1034" font-size="18" fill="#1A1A1A" text-anchor="middle">a software-defined blend of fiber, LEO, and commercial internet underlays.</text>
    <text x="800" y="1066" font-size="13" font-weight="700" fill="#1A1A1A" letter-spacing="2" text-anchor="middle">MaiaEdge · Intel IPU</text>
  </g>
</svg>
